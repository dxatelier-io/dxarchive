<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DX</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@300;400;500;600&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- floating doodles -->
  <div class="doodle star">⭐</div>
  <div class="doodle heart">💖</div>
  <div class="doodle cloud">☁️</div>
  <div class="doodle flower">🌼</div>
  <div class="doodle sparkle">✨</div>

  <!-- wallpaper blur -->
  <div class="bg-blur"></div>

  <!-- top widgets -->
  <header class="topbar">
    <button id="modeBtn" class="mode-toggle glass">🌙</button>
    <div class="widget">
      <span>🕒</span>
      <p id="clock">00:00</p>
    </div>

    <div class="widget quote-box">
      <span>💭</span>
      <p id="quote">welcome to DX</p>
    </div>
  </header>

  <!-- main homescreen -->
  <main class="homescreen">

    <div class="welcome-box glass">
      <p class="tiny-text">personal archive system</p>
      <h1>DX</h1>
      <p class="subtitle">
        a colorful little corner filled with memories,
        thoughts, chaos, and things i never posted.
      </p>
    </div>

    <!-- app icons -->
    <section class="apps">

      <a href="about.html" class="app-icon glass">
        <div class="icon">🧸</div>
        <p>About</p>
      </a>

      <a href="journal.html" class="app-icon glass">
        <div class="icon">📔</div>
        <p>Journal</p>
      </a>

      <a href="gallery.html" class="app-icon glass">
        <div class="icon">📸</div>
        <p>Gallery</p>
      </a>

      <a href="works.html" class="app-icon glass">
        <div class="icon">🎨</div>
        <p>Works</p>
      </a>

      <a href="contact.html" class="app-icon glass">
        <div class="icon">💌</div>
        <p>Contact</p>
      </a>

      <div class="app-icon glass secret">
        <div class="icon">🔒</div>
        <p>Secret</p>
      </div>

    </section>

  </main>

  <!-- bottom music widget -->
  <div class="music-player glass">
    <div>
      <p class="song">Now Playing</p>
      <h4>dreaming in colors</h4>
    </div>

    <button id="musicBtn">▶</button>
  </div>

  <script src="script.js"></script>
</body>
</html>
